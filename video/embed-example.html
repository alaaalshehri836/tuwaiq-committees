<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نادي طويق — فيديو اللجان الإدارية</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080611; }
      .tuwaiq-video { width: min(100%, 1280px); aspect-ratio: 16 / 9; border-radius: 16px; background: #080611; }
    </style>
  </head>
  <body>
    <!-- Standard HTML5 embed. Browsers only autoplay when muted: visitors unmute with the controls to hear the soundtrack. -->
    <video
      class="tuwaiq-video"
      src="tuwaiq-committees-web-720p-audio.mp4"
      poster="poster.jpg"
      autoplay
      muted
      playsinline
      loop
      controls
      preload="metadata"
    >
      <a href="tuwaiq-committees-1080p.mp4">تحميل الفيديو</a>
    </video>
  </body>
</html>
